# ============================================================
# Gradle JVM settings — tuned for Termux / low-RAM Android phones.
# 2 GB daemon heap is the sweet spot: enough for AGP 8.x + R8,
# small enough to survive on a 3–4 GB RAM device alongside other apps.
# ============================================================
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# ============================================================
# Performance
# ============================================================
# Parallel execution helps on multi-core phones; the daemon keeps
# incremental builds fast without re-parsing everything.
org.gradle.parallel=true
org.gradle.daemon=true
org.gradle.caching=true
org.gradle.configureondemand=false

# Termux: inotify file-watch limits are usually exhausted by AGP,
# which causes random "too many open files" errors. Disable VFS
# watching — the slight config-time hit is worth the stability.
org.gradle.vfs.watch=false

# ============================================================
# AndroidX (REQUIRED — build fails without this)
# ============================================================
android.useAndroidX=true
android.enableJetifier=false

# Non-transitive R classes speed up incremental builds and reduce
# memory on R8. Safe for a single-module project.
android.nonTransitiveRClass=true

# ============================================================
# Kotlin — we do not use Kotlin, so suppress the KGP hint
# that newer AGP versions print at every build.
# ============================================================
android.suppressUnsupportedCompileSdk=35

# ============================================================
# Termux ARM64 aapt2 workaround.
# AGP 8.x ships an x86_64 aapt2 binary that will NOT run on ARM64.
# Comment the next two lines out on x86_64 machines; uncomment on
# Termux if you install the native aapt2 package:
#     pkg install aapt
# and ensure the binary lives at $PREFIX/bin/aapt2.
# If aapt2 is not available, Gradle falls back to the default and
# the build will fail with "error=13, Permission denied" or
# "Exec format error" — in that case, install aapt2 and uncomment.
# ============================================================
# android.aapt2FromMavenOverride=/data/data/com.termux/files/usr/bin/aapt2

# ============================================================
# Release signing placeholder — populated once keystore exists.
# Debug builds do not require these.
# ============================================================
# PULSE_RELEASE_STORE_FILE=
# PULSE_RELEASE_STORE_PASSWORD=
# PULSE_RELEASE_KEY_ALIAS=
# PULSE_RELEASE_KEY_PASSWORD=
