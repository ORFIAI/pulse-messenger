name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Decode google-services.json
      run: |
        echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > app/google-services.json

    # ----------------------------------------------------------------
    # SHA-1 Caching: Ensures the debug keystore (and its SHA-1) 
    # remains the same across all GitHub Action builds.
    # ----------------------------------------------------------------
    - name: Cache Debug Keystore
      uses: actions/cache@v4
      id: debug-keystore-cache
      with:
        path: ~/.android/debug.keystore
        key: ${{ runner.os }}-debug-keystore

    - name: Generate Debug Keystore (if not cached)
      if: steps.debug-keystore-cache.outputs.cache-hit != 'true'
      run: |
        mkdir -p ~/.android
        keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

    - name: Print Debug SHA-1
      run: |
        echo "========== YOUR DEBUG SHA-1 FINGERPRINT =========="
        keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android -keypass android | grep SHA1
        echo "==================================================="

    # ----------------------------------------------------------------
    # Build Steps
    # ----------------------------------------------------------------
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew clean assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Pulse-Messenger-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
