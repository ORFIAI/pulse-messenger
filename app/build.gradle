// App module build file.
// Toolchain: AGP 8.7.3, Gradle 8.10.2, JDK 17+ (JDK 21 recommended on Termux).
// Firebase BoM 34.12.0 pins every Firebase artifact below to compatible versions.
//
// IMPORTANT: this module applies the 'com.google.gms.google-services' plugin.
// That plugin REQUIRES a real app/google-services.json to exist before any
// Gradle task can run. If you have not yet downloaded your google-services.json
// from the Firebase Console, the build will fail with:
//     File google-services.json is missing.
// Create the Firebase project first (Auth→Google, Firestore, FCM,
// Realtime Database, and register SHA-1 + SHA-256), then drop the file at
// app/google-services.json. Do not invent the file.

plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.pulse.messenger'
    compileSdk 35

    defaultConfig {
        applicationId 'com.pulse.messenger'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0.0'

        // Required for Media3 ExoPlayer and Material 3 APIs.
        vectorDrawables.useSupportLibrary = true

        // Preserve field names used by Firestore's automatic JSON mapping.
        // Without this, minified release builds rename POJO fields and break
        // Firestore deserialization. Must stay enabled in every variant.
        buildConfigField 'boolean', 'FIRESTORE_POJO_MAPPING', 'true'

        // CRITICAL FOR YOUR PHONE (Redmi 9 Active):
        // Restricts the build to 32-bit ARM libraries only.
        // This prevents the app from crashing or failing to install on 32-bit devices.
        ndk {
            abiFilters 'armeabi-v7a'
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            debuggable true
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                          'proguard-rules.pro'

            // Release signing is intentionally NOT configured here yet.
            // We will add a signing config only after we have a keystore.
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    packaging {
        resources {
            // Both Media3 and Firebase pull in proguard notices; keep one copy.
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/LICENSE.md',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt',
                'META-INF/NOTICE.md'
            ]
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // ----------------------------------------------------------------
    // Firebase BoM
    // ----------------------------------------------------------------
    implementation platform('com.google.firebase:firebase-bom:34.12.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    
    // NOTE: firebase-storage is INTENTIONALLY REMOVED.
    // We are using Cloudinary (free, no credit card required) for media.
    // implementation 'com.google.firebase:firebase-storage'
    
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-database'

    // ----------------------------------------------------------------
    // Google Sign-In via Credential Manager
    // ----------------------------------------------------------------
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'

    // ----------------------------------------------------------------
    // AndroidX core / UI
    // ----------------------------------------------------------------
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.fragment:fragment:1.8.5'
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-process:2.8.7'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'

    // ----------------------------------------------------------------
    // Material Components 3
    // ----------------------------------------------------------------
    implementation 'com.google.android.material:material:1.12.0'

    // ----------------------------------------------------------------
    // Image loading — Glide
    // ----------------------------------------------------------------
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'

    // ----------------------------------------------------------------
    // Media3 ExoPlayer
    // ----------------------------------------------------------------
    implementation 'androidx.media3:media3-exoplayer:1.5.0'
    implementation 'androidx.media3:media3-ui:1.5.0'

    // ----------------------------------------------------------------
    // Testing
    // ----------------------------------------------------------------
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
